name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::rmarkdown
            any::testthat
            any::lintr
      - name: Lint
        run: |
          lints <- lintr::lint_dir("R")
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}
      - name: Tests
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
      - name: Run analysis and render report
        run: Rscript analysis/run_analysis.R
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
